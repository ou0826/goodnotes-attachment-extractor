name: 功能建议
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先说明使用场景，而不仅仅是"希望加一个功能"。这样更容易判断是否值得实现。
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的具体问题
      description: 例如"我需要把提取出的 M4A 批量转成 MP3，但现在只能一个个处理"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 你希望的解决方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 确认事项
      options:
        - label: 我已搜索现有 Issue 和文档，没有重复建议
          required: true
