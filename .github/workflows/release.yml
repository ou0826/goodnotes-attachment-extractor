name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build executable
        run: python scripts/build_exe.py

      - name: Rename artifact
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Copy-Item "dist/GoodNotes-Attachment-Extractor.exe" "dist/GoodNotes-Attachment-Extractor-$tag-win64.exe"
          Get-ChildItem dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GoodNotes-Attachment-Extractor-*-win64.exe
          generate_release_notes: true
          draft: false
          prerelease: false
